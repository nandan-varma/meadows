# Meadows Compiler Test Configuration

# Test execution settings
[execution]
timeout_seconds = 30
max_parallel_tests = 4
continue_on_failure = true
verbose_output = false
generate_detailed_logs = true

# Performance test thresholds
[performance]
max_compilation_time_seconds = 10.0
max_memory_usage_mb = 512
max_executable_size_kb = 1024
enable_performance_benchmarks = true
performance_regression_threshold = 0.1

# Error handling test settings
[error_handling]
test_syntax_errors = true
test_runtime_errors = true
test_memory_errors = true
test_error_recovery = true
expect_graceful_failures = true

# Code generation test settings
[code_generation]
test_ir_generation = true
test_optimization_levels = [0, 1, 2, 3]
verify_ir_correctness = true
test_executable_generation = true
test_debug_symbols = false

# Test categories to run
[categories]
basic_language_tests = true
lexer_tests = true
parser_tests = true
expression_tests = true
statement_tests = true
function_tests = true
class_tests = true
compilation_tests = true
error_handling_tests = true
performance_tests = true
ir_generation_tests = true
integration_tests = true
application_tests = true
edge_case_tests = true

# File patterns for test discovery
[discovery]
test_file_patterns = ["test_*.py", "*_test.py"]
test_directories = ["tests/", "examples/"]
exclude_patterns = ["*_broken.py", "experimental_*.py"]

# Reporting settings
[reporting]
output_format = "detailed"  # "summary", "detailed", "json", "xml"
generate_html_report = true
generate_coverage_report = true
generate_performance_report = true
report_output_directory = "test_results/"
save_compilation_artifacts = false

# Continuous integration settings
[ci]
fail_fast = false
generate_junit_xml = true
upload_artifacts = false
notify_on_failure = true
compare_with_baseline = true
baseline_file = "test_baselines.json"

# Advanced testing options
[advanced]
enable_stress_testing = false
stress_test_iterations = 100
enable_memory_leak_detection = false
enable_valgrind_testing = false
enable_sanitizer_testing = false
enable_fuzzing = false
fuzzing_iterations = 1000

# Platform-specific settings
[platform]
test_cross_compilation = false
target_platforms = ["x86_64", "arm64"]
test_different_os = false
target_os = ["linux", "macos", "windows"]

# Debug and development settings
[debug]
enable_debug_output = false
save_intermediate_files = false
enable_profiling = false
enable_coverage_tracking = true
dump_ast_on_failure = false
dump_ir_on_failure = false

# Test data and fixtures
[fixtures]
use_test_fixtures = true
fixture_directory = "test_fixtures/"
generate_random_test_data = false
random_seed = 42
large_test_file_size_mb = 10

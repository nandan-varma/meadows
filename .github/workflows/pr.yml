name: Pull Request

on:
  pull_request:
    branches: [main, master]
  push:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            llvm-package: llvm-17-dev
          - os: macos-latest
            llvm-package: llvm@17

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '3.28.x'

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: |
            ~/llvm-cache
            /usr/lib/llvm-17
          key: llvm-17-${{ matrix.os }}-${{ hashFiles('CMakeLists.txt', '.github/workflows/*.yml') }}

      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update
            sudo apt-get install -y ${{ matrix.llvm-package }} cmake build-essential
          else
            brew install ${{ matrix.llvm-package }} cmake
          fi

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Run Unit Tests
        run: ./build/tests/meadows_tests

      - name: Run Integration Tests
        run: ./scripts/test/run_integration_tests.sh

  format:
    name: Code Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Format
        run: ./scripts/dev/format.sh --check

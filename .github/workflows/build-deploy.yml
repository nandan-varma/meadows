name: Build and Deploy WebAssembly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest
        actions-cache-folder: 'emsdk-cache'
        
    - name: Verify Emscripten installation
      run: |
        echo "Verifying Emscripten installation..."
        which emcc
        emcc --version
        echo "EMSDK path: $EMSDK"
        
    - name: Build WebAssembly module
      run: |
        echo "Building WebAssembly module..."
        
        # Source Emscripten environment
        source $EMSDK/emsdk_env.sh
        
        # Create build directory
        mkdir -p build-wasm
        cd build-wasm
        
        # Configure with emcmake
        echo "Configuring build with emcmake..."
        emcmake cmake .. \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_WASM=ON \
          -DSKIP_LLVM_FIND=ON
        
        # Build the WebAssembly target
        echo "Building with emmake..."
        emmake make meadows_wasm -j$(nproc)
        
        # List what was generated
        echo "Build completed. Generated files:"
        ls -la .
        
        # Check if the WASM files were generated in the correct location
        if [ -f meadows.js ] && [ -f meadows.wasm ]; then
          echo "✓ WebAssembly files generated successfully"
          echo "meadows.js size: $(du -h meadows.js | cut -f1)"
          echo "meadows.wasm size: $(du -h meadows.wasm | cut -f1)"
        else
          echo "✗ WebAssembly files not found in expected location"
          echo "Looking for WASM files in other locations..."
          find . -name "*.wasm" -o -name "meadows.js" || true
          echo "Build may have failed. Check the build output above."
          exit 1
        fi
        
    - name: Prepare web files for deployment
      run: |
        echo "Preparing web files for deployment..."
        mkdir -p dist
        
        # Copy all web files first
        if [ -d "web" ]; then
          cp -r web/* dist/
          echo "✓ Copied web files to dist/"
        else
          echo "✗ Web directory not found"
          exit 1
        fi
        
        # Copy generated WASM files from build directory
        cd build-wasm
        if [ -f meadows.js ] && [ -f meadows.wasm ]; then
          cp meadows.js ../dist/
          cp meadows.wasm ../dist/
          echo "✓ Copied generated WASM files to dist/"
          echo "meadows.js size: $(du -h meadows.js | cut -f1)"
          echo "meadows.wasm size: $(du -h meadows.wasm | cut -f1)"
        else
          echo "✗ Generated WASM files not found in build-wasm/"
          echo "Available files in build-wasm/:"
          ls -la .
          echo "Searching for WASM files..."
          find . -name "*.wasm" -o -name "meadows.js" || true
          exit 1
        fi
        cd ..
        
        # Create build info
        echo "Build date: $(date)" > dist/build-info.txt
        echo "Commit: ${GITHUB_SHA}" >> dist/build-info.txt
        echo "WASM build: successful" >> dist/build-info.txt
        
        echo "Final deployment contents:"
        ls -la dist/
        
        # Verify critical files exist
        for file in index.html styles.css meadows.js meadows.wasm; do
          if [ -f "dist/$file" ]; then
            echo "✓ $file is ready for deployment"
          else
            echo "✗ $file is missing!"
            exit 1
          fi
        done
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

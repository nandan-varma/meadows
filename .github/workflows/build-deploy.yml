name: Build and Deploy WebAssembly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Emscripten (optional)
      continue-on-error: true
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest
        
    - name: Try WebAssembly build (optional)
      continue-on-error: true
      run: |
        echo "Attempting WebAssembly build..."
        if command -v emcc &> /dev/null; then
          echo "Emscripten found, trying WASM build..."
          # Source the Emscripten environment
          if [ -f "${EMSDK}/emsdk_env.sh" ]; then
            source "${EMSDK}/emsdk_env.sh"
            echo "Sourced Emscripten environment"
          fi
          
          # Simple attempt - if it fails, we'll deploy static files
          emcmake cmake -B build-wasm -S . \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_WASM=ON \
            -DSKIP_LLVM_FIND=ON || echo "WASM config failed, continuing with static files"
          if [ -f build-wasm/Makefile ]; then
            emmake make -C build-wasm -j$(nproc) || echo "WASM build failed, continuing with static files"
          fi
        else
          echo "Emscripten not available, deploying static files only"
        fi
        
    - name: Prepare web files
      run: |
        mkdir -p dist
        
        # Copy all web files
        if [ -d "web" ]; then
          cp -r web/* dist/
          echo "Copied web files to dist/"
        fi
        
        # Copy WASM files if they exist (required for functionality)
        if [ -f "build-wasm/meadows.js" ]; then
          cp build-wasm/meadows.js dist/
          echo "Copied generated WASM JS file"
        fi
        if [ -f "build-wasm/meadows.wasm" ]; then
          cp build-wasm/meadows.wasm dist/
          echo "Copied generated WASM file"
        fi
        
        # Create build info
        echo "Build date: $(date)" > dist/build-info.txt
        echo "Commit: ${GITHUB_SHA}" >> dist/build-info.txt
        
        echo "Final deployment contents:"
        ls -la dist/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

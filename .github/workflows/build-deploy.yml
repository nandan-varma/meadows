name: Build and Deploy WebAssembly

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Emscripten
      continue-on-error: true
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest
        
    - name: Try WebAssembly build
      continue-on-error: true
      run: |
        if command -v emcc &> /dev/null; then
          emcmake cmake -B build-wasm -S . -DCMAKE_BUILD_TYPE=Release -DBUILD_WASM=ON || echo "WASM config failed"
          emmake make -C build-wasm -j$(nproc) || echo "WASM build failed"
        fi
        
    - name: Prepare web files
      run: |
        mkdir -p dist
        cp -r web/* dist/ 2>/dev/null || true
        
        # Ensure index.html exists
        if [ ! -f dist/index.html ]; then
          cp web/index.html dist/
        fi
        
        echo "Build date: $(date)" > dist/build-info.txt
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

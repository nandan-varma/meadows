name: Build and Deploy WebAssembly

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-native:
    name: Build Native Compiler
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
        
    - name: Install LLVM
      run: |
        wget https://apt.llvm.org/llvm.sh
        chmod +x llvm.sh
        sudo ./llvm.sh 17
        sudo apt-get install -y llvm-17-dev libllvm17
        
    - name: Configure CMake
      run: |
        cmake -B build -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DLLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm
          
    - name: Build native compiler
      run: cmake --build build --parallel
      
    - name: Run tests
      run: |
        cd build
        ./meadows_test
        
    - name: Upload native artifacts
      uses: actions/upload-artifact@v4
      with:
        name: native-compiler
        path: |
          build/meadows
          build/meadows_test

  build-wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    needs: build-native
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Emscripten
      uses: mymindstorm/setup-emsdk@v14
      with:
        version: latest
        
    - name: Install LLVM for Emscripten
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential
        # Use Emscripten's LLVM instead of system LLVM
        
    - name: Configure CMake for WebAssembly
      run: |
        emcmake cmake -B build-wasm -S . \
          -DCMAKE_BUILD_TYPE=Release \
          -DBUILD_WASM=ON \
          -DCMAKE_CROSSCOMPILING_EMULATOR=node
          
    - name: Build WebAssembly
      run: |
        emmake make -C build-wasm -j$(nproc)
        
    - name: Verify WebAssembly build
      run: |
        ls -la web/
        file web/meadows.wasm 2>/dev/null || echo "WASM file not found, checking for .js files"
        ls -la web/*.js 2>/dev/null || echo "No JS files found"
        
    - name: Prepare web deployment
      run: |
        mkdir -p dist
        cp web/*.html dist/ 2>/dev/null || true
        cp web/*.css dist/ 2>/dev/null || true
        cp web/*.js dist/ 2>/dev/null || true
        cp web/*.wasm dist/ 2>/dev/null || true
        
        # Create a simple index if none exists
        if [ ! -f dist/index.html ]; then
          cp web/index.html dist/
        fi
        
        # Ensure all required files are present
        echo "Files in dist directory:"
        ls -la dist/
        
    - name: Upload WebAssembly artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wasm-compiler
        path: dist/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build-wasm
    if: github.ref == 'refs/heads/main'
    
    permissions:
      contents: read
      pages: write
      id-token: write
      
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
    - name: Download WebAssembly artifacts
      uses: actions/download-artifact@v4
      with:
        name: wasm-compiler
        path: dist/
        
    - name: Setup Pages
      uses: actions/configure-pages@v4
      
    - name: Upload to GitHub Pages
      uses: actions/upload-pages-artifact@v3
      with:
        path: dist/
        
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build-native, build-wasm]
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Download native artifacts
      uses: actions/download-artifact@v4
      with:
        name: native-compiler
        path: build/
        
    - name: Download WASM artifacts
      uses: actions/download-artifact@v4
      with:
        name: wasm-compiler
        path: web-dist/
        
    - name: Make binaries executable
      run: |
        chmod +x build/meadows
        chmod +x build/meadows_test
        
    - name: Run comprehensive tests
      run: |
        ./run_tests.sh comprehensive
        
    - name: Setup Node.js for WASM testing
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Test WebAssembly module
      run: |
        cd web-dist
        # Simple verification that files exist
        ls -la
        echo "WebAssembly files ready for deployment"
        
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          build/test_report.html
          TEST_RESULTS.md

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.get_version.outputs.tag_name }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ steps.get_version.outputs.tag_name }}
          name: Meadows Compiler ${{ steps.get_version.outputs.version }}
          body: |
            ## Meadows Compiler ${{ steps.get_version.outputs.version }}

            Pre-built binaries for Linux and macOS.

            ### Binaries
            - `meadows` - Release build
            - `meadows-debug` - Debug build
            - `meadows_test` - Test runner
          draft: false
          prerelease: false

  build:
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            llvm-package: llvm-17-dev
            artifact_name: meadows-linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            llvm-package: llvm@17
            artifact_name: meadows-macos-x64
            archive_ext: zip

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: cmake-actions/setupcmake@v1

      - name: Cache LLVM
        id: cache-llvm
        uses: actions/cache@v4
        with:
          path: ~/llvm-cache
          key: llvm-17-release-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            llvm-17-release-${{ matrix.os }}-

      - name: Install LLVM
        if: steps.cache-llvm.outputs.cache-hit != 'true'
        run: |
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y ${{ matrix.llvm-package }}
          else
            brew install ${{ matrix.llvm-package }}
          fi

      - name: Cache Build
        uses: actions/cache@v4
        with:
          path: build-${{ matrix.os }}
          key: build-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            build-${{ matrix.os }}-

      - name: Configure & Build Debug
        run: |
          cmake -B build-debug -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTS=ON
          cmake --build build-debug --parallel $(nproc)

      - name: Configure & Build Release
        run: |
          cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON
          cmake --build build-release --parallel $(nproc)

      - name: Run Tests
        run: |
          ./build-release/tests/meadows_tests
          ./scripts/test/run_integration_tests.sh

      - name: Package Artifacts
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          mkdir -p release/${{ matrix.artifact_name }}

          cp build-release/bin/Meadows release/${{ matrix.artifact_name }}/meadows
          cp build-debug/bin/Meadows release/${{ matrix.artifact_name }}/meadows-debug
          cp test.sh release/${{ matrix.artifact_name }}/
          cp README.md release/${{ matrix.artifact_name }}/
          chmod +x release/${{ matrix.artifact_name }}/meadows*

          cat > release/${{ matrix.artifact_name }}/VERSION << EOF
          Meadows Compiler ${VERSION}
          Platform: ${{ matrix.os }}
          Commit: ${{ github.sha }}
          EOF

          cd release
          ARCHIVE_NAME=${{ matrix.artifact_name }}-${VERSION}.${{ matrix.archive_ext }}
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            tar -czf "${ARCHIVE_NAME}" ${{ matrix.artifact_name }}/
          else
            zip -r "${ARCHIVE_NAME}" ${{ matrix.artifact_name }}/
          fi
          echo "ARCHIVE=${ARCHIVE_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Release Asset
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ needs.create-release.outputs.tag_name }}
          artifacts: release/${{ matrix.artifact_name }}-${{ needs.create-release.outputs.version }}.${{ matrix.archive_ext }}
          allowUpdates: true
          omitBodyDuringUpdate: true
          omitNameDuringUpdate: true

name: Release

on:
  push:
    tags: [v*.*.*]

permissions:
  contents: write

jobs:
  package:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF \
            -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm"
          cmake --build build --parallel
      - name: Package
        run: |
          cpack --config build/CPackConfig.cmake -B dist
          mv dist/meadows-*.tar.gz "dist/meadows-${{ github.ref_name }}-${{ matrix.name }}.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: meadows-${{ matrix.name }}
          path: dist/*.tar.gz

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Meadows ${{ github.ref_name }}
          files: artifacts/*.tar.gz

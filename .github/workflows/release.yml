name: Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2.1.3, etc.
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            llvm: /usr/lib/llvm-17/lib/cmake/llvm
            artifact_name: meadows-linux-x64
            binary_ext: ""
          - os: macos-latest
            llvm: $(brew --prefix llvm@17)/lib/cmake/llvm
            artifact_name: meadows-macos-x64
            binary_ext: ""

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies (Linux/macOS)
      shell: bash
      run: |
        echo "Installing dependencies on ${{ matrix.os }}..."
        
        # Install cmake and build tools
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          sudo apt-get update
          sudo apt-get install -y cmake build-essential llvm-17-dev
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          brew install cmake llvm@17
        fi
        
    - name: Configure CMake
      shell: bash
      run: |
        echo "Configuring CMake for Release build..."
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="${{ matrix.llvm }}"
        
    - name: Build Release
      shell: bash
      run: |
        echo "Building release binaries..."
        cmake --build build --parallel --config Release
        
    - name: Run tests
      shell: bash
      run: |
        echo "Running tests to verify build..."
        ./build/meadows_test -m
        
    - name: Prepare release artifacts
      shell: bash
      run: |
        echo "Preparing release artifacts..."
        
        # Create release directory
        mkdir -p release/${{ matrix.artifact_name }}
        
        # Copy binaries
        cp build/meadows${{ matrix.binary_ext }} release/${{ matrix.artifact_name }}/
        cp build/meadows_test${{ matrix.binary_ext }} release/${{ matrix.artifact_name }}/
        
        # Copy documentation and scripts
        cp README.md release/${{ matrix.artifact_name }}/
        cp run_tests.sh release/${{ matrix.artifact_name }}/
        cp format.sh release/${{ matrix.artifact_name }}/
        
        # Create a simple install script
        cat > release/${{ matrix.artifact_name }}/install.sh << 'EOF'
        #!/bin/bash
        # Simple install script for Meadows compiler
        
        INSTALL_DIR="${HOME}/.local/bin"
        
        echo "Installing Meadows compiler to ${INSTALL_DIR}..."
        
        # Create install directory if it doesn't exist
        mkdir -p "${INSTALL_DIR}"
        
        # Copy binaries
        cp meadows "${INSTALL_DIR}/"
        cp meadows_test "${INSTALL_DIR}/"
        
        # Make sure binaries are executable
        chmod +x "${INSTALL_DIR}/meadows"
        chmod +x "${INSTALL_DIR}/meadows_test"
        
        echo "Installation complete!"
        echo "Make sure ${INSTALL_DIR} is in your PATH"
        echo "You can run: export PATH=\"${INSTALL_DIR}:\$PATH\""
        EOF
        
        chmod +x release/${{ matrix.artifact_name }}/install.sh
        
        # Display what we're including
        echo "Release contents:"
        ls -la release/${{ matrix.artifact_name }}/
        
    - name: Create archive
      shell: bash
      run: |
        cd release
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}/
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          zip -r ${{ matrix.artifact_name }}.zip ${{ matrix.artifact_name }}/
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: release/${{ matrix.artifact_name }}.*
        retention-days: 30

  create-release:
    needs: build-and-release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts/
        
    - name: Display downloaded artifacts
      run: |
        echo "Downloaded artifacts:"
        find artifacts/ -type f -name "*.tar.gz" -o -name "*.zip" | sort
        
    - name: Extract version from tag
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"
        
    - name: Generate release notes
      id: release_notes
      run: |
        cat > release_notes.md << EOF
        # Meadows Compiler ${VERSION}
        
        ## What's included
        
        This release includes pre-built binaries for:
        - **Linux (x64)**: \`meadows-linux-x64.tar.gz\`
        - **macOS (x64)**: \`meadows-macos-x64.zip\`
        
        ## Installation
        
        ### Quick Install
        1. Download the appropriate archive for your platform
        2. Extract the archive
        3. Run the included \`install.sh\` script
        
        ### Manual Install
        1. Extract the binaries to a directory in your PATH
        2. Make sure the binaries are executable: \`chmod +x meadows meadows_test\`
        
        ## Contents
        Each archive contains:
        - \`meadows\` - The main compiler executable
        - \`meadows_test\` - Test runner for the compiler
        - \`install.sh\` - Installation script
        - \`README.md\` - Project documentation
        - Additional utility scripts
        
        ## Usage
        After installation, you can use the compiler with:
        \`\`\`bash
        meadows input_file.mds
        \`\`\`
        
        Run tests with:
        \`\`\`bash
        meadows_test -m
        \`\`\`
        EOF
        
        echo "release_notes<<EOF" >> $GITHUB_OUTPUT
        cat release_notes.md >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        
    - name: Create Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        name: Meadows Compiler ${{ steps.version.outputs.version }}
        body: ${{ steps.release_notes.outputs.release_notes }}
        draft: false
        prerelease: false
        files: |
          artifacts/meadows-linux-x64/meadows-linux-x64.tar.gz
          artifacts/meadows-macos-x64/meadows-macos-x64.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

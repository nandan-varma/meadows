name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            deps: sudo apt-get update && sudo apt-get install -y cmake build-essential llvm-17-dev
            llvm: /usr/lib/llvm-17/lib/cmake/llvm
          - os: macos-latest
            deps: brew install cmake llvm@17
            llvm: $(brew --prefix llvm@17)/lib/cmake/llvm
          - os: windows-latest
            deps: choco install cmake llvm --version=17.0.6
            llvm: C:/Program Files/LLVM/lib/cmake/llvm

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: ${{ matrix.deps }}
      
    - name: Build
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="${{ matrix.llvm }}"
        cmake --build build --parallel
        
    - name: Test
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          ./build/Release/meadows_test.exe -m || ./build/Debug/meadows_test.exe -m
        else
          ./build/meadows_test -m
        fi

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false  # Don't stop other OS builds if one fails
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            llvm: /usr/lib/llvm-17/lib/cmake/llvm
          - os: macos-latest
            llvm: $(brew --prefix llvm@17)/lib/cmake/llvm

    steps:
    - uses: actions/checkout@v4
    
    - name: Check and install dependencies (Linux/macOS)
      shell: bash
      run: |
        echo "Checking existing installations..."
        
        # Check cmake
        if ! command -v cmake &> /dev/null; then
          echo "Installing cmake..."
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get update && sudo apt-get install -y cmake build-essential
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install cmake
          fi
        else
          echo "cmake already installed: $(cmake --version | head -1)"
        fi
        
        # Check LLVM
        llvm_installed=false
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          if dpkg -l | grep -q "llvm-17-dev\|llvm-dev"; then
            llvm_installed=true
          fi
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          if brew list llvm@17 &> /dev/null || brew list llvm &> /dev/null; then
            llvm_installed=true
          fi
        fi
        
        if [[ "$llvm_installed" == "false" ]]; then
          echo "Installing LLVM..."
          if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
            sudo apt-get install -y llvm-17-dev
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            brew install llvm@17
          fi
        else
          echo "LLVM already installed"
        fi
      
    - name: Verify LLVM installation
      shell: bash
      run: |
        echo "Verifying LLVM installation for ${{ matrix.os }}..."
        
        echo "Checking LLVM installation for Unix-like system..."
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          dpkg -l | grep llvm || echo "No LLVM packages found"
          ls -la "${{ matrix.llvm }}" || echo "LLVM CMake files not found at ${{ matrix.llvm }}"
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          brew list | grep llvm || echo "No LLVM packages found"
          ls -la "${{ matrix.llvm }}" || echo "LLVM CMake files not found at ${{ matrix.llvm }}"
        fi
        
    - name: Build
      shell: bash
      run: |
        echo "Building on ${{ matrix.os }}..."
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="${{ matrix.llvm }}"
        cmake --build build --parallel
        
    - name: Test
      shell: bash
      run: |
        ./build/meadows_test -m

  release:
    runs-on: ${{ matrix.os }}
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        include:
          - os: ubuntu-latest
            llvm: /usr/lib/llvm-17/lib/cmake/llvm
            artifact_name: meadows-linux-x64
          - os: macos-latest
            llvm: $(brew --prefix llvm@17)/lib/cmake/llvm
            artifact_name: meadows-macos-x64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install dependencies (Linux/macOS)
      shell: bash
      run: |
        echo "Installing dependencies on ${{ matrix.os }}..."
        
        # Install cmake and build tools
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          sudo apt-get update
          sudo apt-get install -y cmake build-essential llvm-17-dev
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          brew install cmake llvm@17
        fi

    - name: Get version info
      id: version
      shell: bash
      run: |
        # Get short commit hash
        COMMIT_HASH=$(git rev-parse --short HEAD)
        # Get current date
        BUILD_DATE=$(date +%Y%m%d)
        # Create version string
        VERSION="${BUILD_DATE}-${COMMIT_HASH}"
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "Version: ${VERSION}"
        
    - name: Build Debug
      shell: bash
      run: |
        echo "Building debug version..."
        cmake -B build-debug -DCMAKE_BUILD_TYPE=Debug -DLLVM_DIR="${{ matrix.llvm }}"
        cmake --build build-debug --parallel
        
    - name: Build Release
      shell: bash
      run: |
        echo "Building release version..."
        cmake -B build-release -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="${{ matrix.llvm }}"
        cmake --build build-release --parallel
        
    - name: Prepare release artifacts
      shell: bash
      run: |
        echo "Preparing release artifacts..."
        
        VERSION="${{ steps.version.outputs.version }}"
        
        # Create release directory
        mkdir -p release/${{ matrix.artifact_name }}
        
        # Copy debug binaries with version suffix
        cp build-debug/meadows release/${{ matrix.artifact_name }}/meadows-${VERSION}-debug
        cp build-debug/meadows_test release/${{ matrix.artifact_name }}/meadows_test-${VERSION}-debug
        
        # Copy release binaries with version suffix
        cp build-release/meadows release/${{ matrix.artifact_name }}/meadows-${VERSION}-release
        cp build-release/meadows_test release/${{ matrix.artifact_name }}/meadows_test-${VERSION}-release
        
        # Copy documentation and scripts
        cp README.md release/${{ matrix.artifact_name }}/
        cp run_tests.sh release/${{ matrix.artifact_name }}/
        cp format.sh release/${{ matrix.artifact_name }}/
        
        # Create version info file
        cat > release/${{ matrix.artifact_name }}/VERSION << EOF
        Meadows Compiler Build ${VERSION}
        Built on: $(date)
        Platform: ${{ matrix.os }}
        Commit: $(git rev-parse HEAD)
        Branch: $(git rev-parse --abbrev-ref HEAD)
        
        Binaries included:
        - meadows-${VERSION}-debug (Debug build with symbols)
        - meadows_test-${VERSION}-debug (Debug test runner)
        - meadows-${VERSION}-release (Optimized release build)
        - meadows_test-${VERSION}-release (Release test runner)
        EOF
        
        # Create install script
        cat > release/${{ matrix.artifact_name }}/install.sh << EOF
        #!/bin/bash
        # Meadows Compiler Installation Script
        
        INSTALL_DIR="\${HOME}/.local/bin"
        VERSION="${VERSION}"
        
        echo "Installing Meadows compiler binaries to \${INSTALL_DIR}..."
        
        # Create install directory if it doesn't exist
        mkdir -p "\${INSTALL_DIR}"
        
        # Copy versioned binaries
        cp meadows-\${VERSION}-debug "\${INSTALL_DIR}/"
        cp meadows_test-\${VERSION}-debug "\${INSTALL_DIR}/"
        cp meadows-\${VERSION}-release "\${INSTALL_DIR}/"
        cp meadows_test-\${VERSION}-release "\${INSTALL_DIR}/"
        
        # Create symlinks to latest versions
        ln -sf meadows-\${VERSION}-release "\${INSTALL_DIR}/meadows"
        ln -sf meadows_test-\${VERSION}-release "\${INSTALL_DIR}/meadows_test"
        ln -sf meadows-\${VERSION}-debug "\${INSTALL_DIR}/meadows-debug"
        ln -sf meadows_test-\${VERSION}-debug "\${INSTALL_DIR}/meadows_test-debug"
        
        # Make sure binaries are executable
        chmod +x "\${INSTALL_DIR}"/meadows-\${VERSION}-*
        
        echo "Installation complete!"
        echo "Make sure \${INSTALL_DIR} is in your PATH:"
        echo "  export PATH=\"\${INSTALL_DIR}:\\\$PATH\""
        echo ""
        echo "Available commands:"
        echo "  meadows           - Latest release build"
        echo "  meadows-debug     - Latest debug build"
        echo "  meadows_test      - Latest test runner (release)"
        echo "  meadows_test-debug - Latest test runner (debug)"
        EOF
        
        chmod +x release/${{ matrix.artifact_name }}/install.sh
        
        # Display what we're including
        echo "Release contents:"
        ls -la release/${{ matrix.artifact_name }}/
        
    - name: Create archive
      shell: bash
      run: |
        cd release
        VERSION="${{ steps.version.outputs.version }}"
        if [[ "${{ matrix.os }}" == "ubuntu-latest" ]]; then
          tar -czf ${{ matrix.artifact_name }}-${VERSION}.tar.gz ${{ matrix.artifact_name }}/
        elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
          zip -r ${{ matrix.artifact_name }}-${VERSION}.zip ${{ matrix.artifact_name }}/
        fi
        
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}-${{ steps.version.outputs.version }}
        path: release/${{ matrix.artifact_name }}-${{ steps.version.outputs.version }}.*
        retention-days: 90

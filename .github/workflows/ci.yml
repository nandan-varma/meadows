name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false  # Don't stop other OS builds if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: llvm-17
        cmake: true
        ninja: true
        
    - name: Build
      shell: bash
      run: |
        echo "Building on ${{ matrix.os }}..."
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
        else
          cmake -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
        fi
        
    - name: Test
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          ./build/meadows_test.exe -m
        else
          ./build/meadows_test -m
        fi

name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
        # Sets LLVM_PATH env var to the install root

      - uses: jwlawson/actions-setup-cmake@v2

      - name: Build and Test
        env:
          # LLVM_PATH is set by KyleMayes/install-llvm-action
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
          LD_LIBRARY_PATH: ${{ env.LLVM_PATH }}/lib
          DYLD_LIBRARY_PATH: ${{ env.LLVM_PATH }}/lib
          MEADOWS_CLANG: ${{ env.LLVM_PATH }}/bin/clang++
        run: ./scripts/ci/run_ci.sh --llvm "$LLVM_DIR"

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results-${{ matrix.os }}
          path: build*/

  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
      - run: ./scripts/dev/run_static_analysis.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"

      - uses: jwlawson/actions-setup-cmake@v2

      - uses: github/codeql-action/init@v4
        with:
          languages: cpp

      - name: Build for CodeQL
        env:
          LLVM_DIR: ${{ env.LLVM_PATH }}/lib/cmake/llvm
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DLLVM_DIR="$LLVM_DIR" \
            -DBUILD_TESTS=OFF
          cmake --build build --parallel

      - uses: github/codeql-action/analyze@v4

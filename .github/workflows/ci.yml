name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DENABLE_WERROR=ON \
            -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm"
          cmake --build build --parallel
      - name: Test
        env:
          MEADOWS_CLANG: ${{ runner.os == 'macOS' && '/usr/bin/clang' || format('{0}/bin/clang', env.LLVM_PATH) }}
          LD_LIBRARY_PATH: ${{ runner.os == 'Linux' && format('{0}/lib', env.LLVM_PATH) || '' }}
        run: ctest --test-dir build --output-on-failure --parallel 4

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
      - name: Build with AddressSanitizer and UBSan
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_C_COMPILER="$LLVM_PATH/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PATH/bin/clang++" \
            -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr -fno-sanitize-recover=undefined -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          cmake --build build --parallel
      - name: Test the compiler, the interpreter and compiled programs
        env:
          MEADOWS_CLANG: ${{ env.LLVM_PATH }}/bin/clang
          MEADOWS_CFLAGS: -fsanitize=address,undefined -fno-sanitize-recover=undefined -g
          ASAN_OPTIONS: detect_leaks=0
          LD_LIBRARY_PATH: ${{ env.LLVM_PATH }}/lib
        run: ctest --test-dir build --output-on-failure --parallel 4

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
      - run: CLANG_FORMAT="$LLVM_PATH/bin/clang-format" scripts/format.sh --check

  webassembly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build the WebAssembly module
        run: |
          emcmake cmake -B build-wasm -DBUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm --parallel
      - name: Run the conformance suite on WebAssembly
        run: ctest --test-dir build-wasm --output-on-failure
      - name: Test and build the playground
        working-directory: web
        run: |
          npm ci
          MEADOWS_WASM=../build-wasm/bin/meadows.js npm test
          npm run build

  language-server:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [meadows-lsp, meadows-vscode]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: lsp/${{ matrix.package }}
        run: |
          npm ci
          npm run build
          npm audit --omit=dev

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "17"
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
      - run: |
          cmake -B build -DBUILD_TESTS=OFF -DLLVM_DIR="$LLVM_PATH/lib/cmake/llvm"
          cmake --build build --parallel
      - uses: github/codeql-action/analyze@v3

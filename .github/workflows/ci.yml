name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false  # Don't stop other OS builds if one fails
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            deps: sudo apt-get update && sudo apt-get install -y cmake build-essential llvm-17-dev
            llvm: /usr/lib/llvm-17/lib/cmake/llvm
          - os: macos-latest
            deps: brew install cmake llvm@17
            llvm: $(brew --prefix llvm@17)/lib/cmake/llvm
          - os: windows-latest
            deps: |
              choco install cmake --no-progress
              choco install llvm --force --no-progress
            llvm: C:/Program Files/LLVM/lib/cmake/llvm

    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      shell: bash
      run: ${{ matrix.deps }}
      
    - name: Build
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --config Release --parallel
        else
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DLLVM_DIR="${{ matrix.llvm }}"
          cmake --build build --parallel
        fi
        
    - name: Test
      shell: bash
      run: |
        if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
          ./build/Release/meadows_test.exe -m || ./build/Debug/meadows_test.exe -m
        else
          ./build/meadows_test -m
        fi

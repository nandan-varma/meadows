name: Deploy Playground

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "web/**"
      - "CMakeLists.txt"
      - ".github/workflows/deploy-playground.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Configure
        run: emcmake cmake -B build-wasm -DBUILD_WASM=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: emmake make -C build-wasm -j$(nproc) meadows_wasm

      - name: Assemble site
        run: |
          mkdir -p dist
          cp web/*.html web/*.js web/*.css dist/
          cp build-wasm/bin/meadows.js build-wasm/bin/meadows.wasm dist/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - id: deployment
        uses: actions/deploy-pages@v4
